
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: python
        additional_dependencies:
          - ruff==0.17.6
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: python
        additional_dependencies:
          - ruff==0.17.6
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy src
        language: python
        additional_dependencies:
          - mypy==2.4.1
        pass_filenames: false
        always_run: true
