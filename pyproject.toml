
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "personal-finance-tracker"
version = "0.1.0"
description = "A CLI-based personal finance tracker built with Python."
requires-python = ">=3.12"
dependencies = []


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.mypy]
python_version = "3.12"
strict = true
